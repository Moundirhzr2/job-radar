name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Start PostgreSQL (PostGIS + pgvector)
        run: docker compose up -d --build --wait
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - name: Build Python package
        run: uv build --wheel
      - name: Check the packaged app with PostgreSQL
        shell: bash
        run: |
          uv pip install --no-deps --reinstall dist/*.whl
          .venv/bin/radar web --port 8765 > "$RUNNER_TEMP/job-radar.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            --max-time 5 --output /dev/null http://127.0.0.1:8765/api/coverage ||
            ! curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:8765/; then
            cat "$RUNNER_TEMP/job-radar.log"
            exit 1
          fi
      - name: Save the tested package
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.N8N_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Envoyer le commit testé à n8n
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          N8N_WEBHOOK_URL: ${{ vars.N8N_WEBHOOK_URL }}
          N8N_CI_TOKEN: ${{ secrets.N8N_CI_TOKEN }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "Le commit testé a été remplacé sur main."
            exit 0
          fi
          payload="$(jq -nc --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '{sha: $sha, branch: $branch}')"
          response="$(curl --fail --silent --show-error --max-time 30 --proto '=https' \
            --request POST --header 'Content-Type: application/json' \
            --header "X-CI-Token: ${N8N_CI_TOKEN:?Secret GitHub requis}" \
            --data-binary "$payload" "$N8N_WEBHOOK_URL")"
          jq -e 'select(.deploymentId | strings | startswith("dpl_"))' <<< "$response"
