services:
  db:
    build: ./db
    image: job-radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost: the temporary server used during first-start setup only listens on the
      # Unix socket, so the database reports healthy once that setup is over.
      test: ["CMD-SHELL", "pg_isready -h localhost -U radar -d radar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
