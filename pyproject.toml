[project]
name = "job-radar"
version = "0.1.0"
description = "Radar de l'emploi local pour étudiants : offres et entreprises autour de soi, et le bon contact pour aller à la source."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Moundir Houazar" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "pgvector>=0.4",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "fastembed>=0.8.1",
    "anthropic>=1.11.0",
    "pydantic>=2.13.5",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "truststore>=0.10",
    # On Windows, the GPU build of ONNX Runtime (it also runs on the CPU when there is no
    # NVIDIA card). 1.26 is the last one built for CUDA 12, which drivers before 580 support.
    "onnxruntime-gpu[cuda,cudnn]==1.26.0; sys_platform == 'win32'",
]

[tool.uv]
# fastembed asks for the CPU build; on Windows the GPU build above replaces it (both install
# the same `onnxruntime` module and cannot live side by side).
override-dependencies = ["onnxruntime>=1.20; sys_platform != 'win32'"]

[project.scripts]
radar = "job_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
